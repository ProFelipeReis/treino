<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <meta name="theme-color" content="#09111a"/>
  <title>Trainly — Bem-vindo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #3dbb86;
      --on-accent: #03150b;
      --text: #f5f8fb;
      --text2: #aab6c2;
      --head: 'Plus Jakarta Sans', 'Nunito', sans-serif;
      --body: 'Plus Jakarta Sans', sans-serif;
      color-scheme: dark;
    }
    html, body { height: 100%; font-family: var(--body); color: var(--text); overflow: hidden; background: #09111a; -webkit-font-smoothing: antialiased; }

    #screen {
      position: relative;
      width: 100%;
      height: 100vh;
      height: 100dvh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-y: auto;
      overscroll-behavior: none;
      padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px));
      background:
        radial-gradient(560px 380px at 100% 0%, rgba(34,224,138,.20), transparent 70%),
        linear-gradient(rgba(9,17,26,.80), rgba(9,17,26,.88)),
        url('https://i.imgur.com/Fjj25UX.jpeg') center/cover no-repeat fixed,
        #09111a;
    }

    .content {
      width: 100%;
      max-width: 380px;
      margin: auto 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .logo {
      height: 150px;
      width: auto;
      max-width: 100%;
      object-fit: contain;
      margin-bottom: 32px;
      animation: fadeDown .6s cubic-bezier(.22,1,.36,1) both;
    }

    .welcome-label {
      font-family: var(--head);
      font-size: .72rem;
      font-weight: 800;
      color: var(--accent);
      text-transform: uppercase;
      letter-spacing: .18em;
      margin-bottom: 10px;
      animation: fadeDown .6s cubic-bezier(.22,1,.36,1) .1s both;
    }

    .welcome-title {
      font-family: var(--head);
      font-size: 1.45rem;
      font-weight: 800;
      color: var(--text);
      text-align: center;
      line-height: 1.25;
      margin-bottom: 32px;
      animation: fadeDown .6s cubic-bezier(.22,1,.36,1) .15s both;
    }

    .cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      animation: fadeUp .65s cubic-bezier(.22,1,.36,1) .25s both;
    }

    /* Card de vidro: o ::before copia a foto de fundo e aplica blur só nele */
    .choice-card {
      display: flex;
      align-items: center;
      gap: 18px;
      padding: 20px 22px;
      border-radius: 20px;
      cursor: pointer;
      text-decoration: none;
      transition: transform .18s cubic-bezier(.22,1,.36,1), border-color .18s;
      position: relative;
      overflow: hidden;
      background: transparent;
      border: 1px solid rgba(255,255,255,.22);
      box-shadow: 0 8px 32px rgba(0,0,0,.30), 0 1.5px 0 rgba(255,255,255,.14) inset;
    }

    .choice-card::before {
      content: '';
      position: absolute;
      inset: -4px;
      background:
        linear-gradient(180deg, rgba(9,17,26,.55) 0%, rgba(9,17,26,.35) 60%),
        url('https://i.imgur.com/Fjj25UX.jpeg') center/cover no-repeat fixed;
      filter: blur(14px);
      z-index: 0;
    }

    .choice-card::after {
      content: '';
      position: absolute;
      inset: 0;
      background: rgba(9,17,26,.38);
      z-index: 1;
      pointer-events: none;
    }

    .card-shine {
      position: absolute;
      inset: 0;
      z-index: 2;
      border-radius: 20px;
      background: linear-gradient(135deg, rgba(255,255,255,.10) 0%, transparent 55%);
      pointer-events: none;
    }

    .choice-card:hover { transform: translateY(-3px); border-color: rgba(61,187,134,.55); }
    .choice-card:active { transform: translateY(0) scale(.99); }

    .card-text, .card-arrow { position: relative; z-index: 3; }

    .card-text { flex: 1; }

    .card-title {
      font-family: var(--head);
      font-size: 1.08rem;
      font-weight: 800;
      color: var(--text);
      margin-bottom: 3px;
    }

    .card-sub {
      font-size: .78rem;
      font-weight: 500;
      color: var(--text2);
    }

    .card-arrow {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background: linear-gradient(135deg, #3dbb86, #34a876);
      color: var(--on-accent);
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      transition: transform .18s;
    }

    .choice-card:hover .card-arrow { transform: translateX(2px); }

    @keyframes fadeDown {
      from { opacity: 0; transform: translateY(-14px); }
      to   { opacity: 1; transform: translateY(0); }
    }
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Desativa seleção de texto apenas em dispositivos touch/mobile ── */
    @media (hover: none) and (pointer: coarse) {
      * {
        -webkit-user-select: none !important;
        -moz-user-select: none !important;
        user-select: none !important;
        -webkit-touch-callout: none !important;
      }
    }
  </style>
<script>
  // Redireciona automaticamente se o usuário já escolheu antes
  // ?choose=1 na URL significa que o usuário clicou em "Trocar perfil" — não redireciona
  (function(){
    try {
      if (new URLSearchParams(window.location.search).get('choose') === '1') return;
      var role = localStorage.getItem('trainly_role');
      if (role === 'trainer') {
        // Só redireciona direto se tiver sessão ativa
        try {
          var sess = localStorage.getItem('forge_gestor_session');
          if (sess && JSON.parse(sess) && JSON.parse(sess).username) {
            window.location.replace('https://trainly.online/app');
          } else {
            window.location.replace('https://trainly.online/login');
          }
        } catch(e) { window.location.replace('https://trainly.online/login'); }
      }
      else if (role === 'aluno') { window.location.replace('https://trainly.online/aluno'); }
    } catch(e) {}
  })();
</script>
  <link rel="icon" type="image/png" href="https://i.imgur.com/9DDa1Th.png">
  <link rel="apple-touch-icon" sizes="180x180" href="https://i.imgur.com/9DDa1Th.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Trainly">
</head>
<body>
<div id="screen">
  <div class="content">
    <img src="https://i.imgur.com/URJ9FaP.png" alt="Trainly" class="logo"/>

    <div class="welcome-label">Bem-vindo ao Trainly</div>
    <div class="welcome-title">Quem é você?</div>

    <div class="cards">

      <!-- Personal Trainer -->
      <a href="https://trainly.online/login" class="choice-card personal" onclick="
        try { localStorage.setItem('trainly_role','trainer'); } catch(e) {}
        try {
          var sess = localStorage.getItem('forge_gestor_session');
          if (sess && JSON.parse(sess) && JSON.parse(sess).username) {
            window.location.href = 'https://trainly.online/app';
            return false;
          }
        } catch(e) {}
      ">
        <div class="card-shine"></div>
        <div class="card-text">
          <div class="card-title">Personal Trainer</div>
          <div class="card-sub">Gerencie alunos e treinos</div>
        </div>
        <div class="card-arrow">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
      </a>

      <!-- Aluno -->
      <a href="https://trainly.online/aluno" class="choice-card" onclick="try{localStorage.setItem('trainly_role','aluno')}catch(e){}">
        <div class="card-shine"></div>
        <div class="card-text">
          <div class="card-title">Aluno</div>
          <div class="card-sub">Acesse seus treinos e evolução</div>
        </div>
        <div class="card-arrow">
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M5 12h14M12 5l7 7-7 7"/>
          </svg>
        </div>
      </a>

    </div>
  </div>
</div>


</body>
</html>
