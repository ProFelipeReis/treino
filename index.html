<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Trainly — Bem-vindo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="apple-touch-icon" sizes="180x180" href="https://i.imgur.com/OKl5PjJ.png">
  <link rel="icon" type="image/png" href="https://i.imgur.com/OKl5PjJ.png">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --accent: #f5c800;
      --head: 'Nunito', sans-serif;
      --body: 'Plus Jakarta Sans', sans-serif;
    }
    html, body { height: 100%; overflow-x: hidden; touch-action: pan-x pan-y; }
    body {
      font-family: var(--body); min-height: 100vh; background: #f0f0ef;
      display: flex; align-items: center; justify-content: center;
      position: relative; overflow: hidden;
    }
    #login-bg-canvas { position: absolute; inset: 0; z-index: 1; pointer-events: none; }
    .welcome-wrap {
      position: relative; z-index: 2; width: 100%; max-width: 340px;
      padding: 24px; display: flex; flex-direction: column; align-items: center;
      margin-top: -80px;
    }
    .brand-logo {
      height: 160px; width: auto; max-width: 100%; object-fit: contain;
      margin-bottom: 32px; filter: drop-shadow(0 4px 24px rgba(0,0,0,0.5));
    }
    .welcome-card {
      width: 100%;
      background: #1c1b18;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 28px;
      padding: 32px 28px 28px;
      box-shadow: 0 8px 40px rgba(0,0,0,0.50);
      position: relative; overflow: hidden;
    }
    .card-inner { position: relative; z-index: 1; }
    .card-title { font-family: var(--head); font-size: 1.15rem; font-weight: 800; color: #fff; text-align: center; margin-bottom: 5px; }
    .card-sub { font-size: .82rem; color: rgba(255,255,255,0.55); text-align: center; margin-bottom: 24px; font-weight: 500; line-height: 1.5; }
    .role-options { display: flex; flex-direction: column; gap: 11px; margin-bottom: 22px; }
    .role-card {
      display: flex; align-items: center; gap: 13px; padding: 14px 16px;
      border-radius: 16px; border: 1.5px solid rgba(255,255,255,0.08);
      background: rgba(255,255,255,0.05); cursor: pointer;
      transition: all .22s cubic-bezier(.22,1,.36,1);
    }
    .role-card:hover { border-color: var(--accent); background: rgba(245,200,0,0.10); transform: translateY(-2px); box-shadow: 0 6px 22px rgba(0,0,0,0.40); }
    .role-card:active { transform: translateY(0); }
    .role-card.selected { border-color: var(--accent); background: rgba(245,200,0,0.13); box-shadow: 0 0 0 3px rgba(245,200,0,.15); }
    .role-icon { width: 44px; height: 44px; border-radius: 11px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: transform .2s; }
    .role-card:hover .role-icon { transform: scale(1.08); }
    .role-icon.trainer { background: rgba(245,200,0,0.14); border: 1.5px solid rgba(245,200,0,0.32); }
    .role-icon.student { background: rgba(255,255,255,0.06); border: 1.5px solid rgba(255,255,255,0.13); }
    .role-info { flex: 1; min-width: 0; }
    .role-title { font-family: var(--head); font-size: .95rem; font-weight: 800; color: #fff; margin-bottom: 2px; }
    .role-desc { font-size: .74rem; color: rgba(255,255,255,0.45); font-weight: 500; line-height: 1.4; }
    .role-arrow {
      width: 25px; height: 25px; border-radius: 7px;
      background: rgba(255,255,255,0.07); border: 1px solid rgba(255,255,255,0.12);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: all .2s;
    }
    .role-card:hover .role-arrow { background: var(--accent); border-color: transparent; }
    .role-card:hover .role-arrow svg { stroke: #111110; }
    .divider { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .divider-line { flex: 1; height: 1px; background: rgba(255,255,255,0.08); }
    .divider-text { font-size: .66rem; font-weight: 700; color: rgba(255,255,255,0.22); text-transform: uppercase; letter-spacing: .1em; }
    .live-dot { display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--accent); margin-right: 5px; vertical-align: middle; animation: pulse 2s infinite; }
    @keyframes pulse { 0%,100%{ opacity:1; transform:scale(1); } 50%{ opacity:.4; transform:scale(.75); } }
    .welcome-footer { margin-top: 18px; text-align: center; font-size: .70rem; color: rgba(255,255,255,0.30); font-weight: 500; line-height: 1.7; }
    .welcome-footer a { color: rgba(255,255,255,0.45); font-weight: 700; text-decoration: none; border-bottom: 1px solid rgba(255,255,255,0.18); }
    .welcome-footer a:hover { color: rgba(255,255,255,0.80); }
    @media (max-width: 400px) {
      .welcome-card { padding: 26px 20px 22px; }
      .brand-logo { height: 120px; margin-bottom: 24px; }
      .welcome-wrap { margin-top: -60px; }
    }
  </style>
</head>
<body>
  <canvas id="login-bg-canvas"></canvas>

  <div class="welcome-wrap">
    <img src="https://i.imgur.com/orva0oM.png" alt="Trainly" class="brand-logo">
    <div class="welcome-card">
      <div class="card-inner">
        <h1 class="card-title">Bem-vindo! 👋</h1>
        <p class="card-sub">Como você usa o Trainly?</p>
        <div class="role-options">
          <div class="role-card" id="card-trainer" onclick="selectRole('trainer')">
            <div class="role-icon trainer">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#f5c800" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
                <circle cx="9" cy="7" r="4"/>
                <path d="M23 21v-2a4 4 0 0 0-3-3.87"/>
                <path d="M16 3.13a4 4 0 0 1 0 7.75"/>
              </svg>
            </div>
            <div class="role-info">
              <div class="role-title">Sou Treinador</div>
              <div class="role-desc">Gerencio alunos, crio fichas e acompanho a evolução</div>
            </div>
            <div class="role-arrow">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
          <div class="role-card" id="card-student" onclick="selectRole('student')">
            <div class="role-icon student">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.75)" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="8" r="4"/>
                <path d="M6 20v-2a4 4 0 0 1 4-4h4a4 4 0 0 1 4 4v2"/>
              </svg>
            </div>
            <div class="role-info">
              <div class="role-title">Sou Aluno</div>
              <div class="role-desc">Acesso minha ficha de treino e registro meu progresso</div>
            </div>
            <div class="role-arrow">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="rgba(255,255,255,0.7)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
            </div>
          </div>
        </div>
        <div class="divider">
          <div class="divider-line"></div>
          <span class="divider-text">Trainly</span>
          <div class="divider-line"></div>
        </div>
        <p style="font-size:.72rem;color:rgba(255,255,255,.28);text-align:center;font-weight:500;">
          <span class="live-dot"></span>Plataforma segura com dados em tempo real
        </p>
      </div>
    </div>
    <p class="welcome-footer">
      Ao continuar você concorda com os<br>
      <a href="#">Termos de Uso</a> e a <a href="#">Política de Privacidade</a>
    </p>
  </div>

  <script>
  (function () {
    const canvas = document.getElementById('login-bg-canvas');
    const ctx = canvas.getContext('2d');
    let W, H, squares, animId;
    const bgImg = new Image();
    bgImg.crossOrigin = 'anonymous';
    bgImg.src = 'https://i.imgur.com/Fjj25UX.jpeg';
    let bgLoaded = false;
    bgImg.onload = function () { bgLoaded = true; };
    function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
    function mkSquare() {
      const size = 28 + Math.random() * 68;
      return { x: Math.random()*W, y: Math.random()*H, size,
        rot: Math.random()*Math.PI*2, rotSpeed: (Math.random()-0.5)*0.007,
        alpha: 0.05+Math.random()*0.12, dx: (Math.random()-0.5)*0.35, dy: -0.25+Math.random()*0.45 };
    }
    function init() { resize(); squares = Array.from({length:40}, mkSquare); }
    function getTrianglePoints() {
      return [ {x:0,y:0}, {x:W,y:0}, {x:W,y:H*0.44}, {x:W*0.5,y:H*0.62}, {x:0,y:H*0.40} ];
    }
    function isAboveTriangle(px, py) {
      const pts=getTrianglePoints(), leftY=pts[4].y, dipY=pts[3].y, rightY=pts[2].y, dipX=pts[3].x;
      let wy;
      if (px<=dipX) { const t=px/dipX; wy=leftY+t*(dipY-leftY); }
      else { const t=(px-dipX)/(W-dipX); wy=dipY+t*(rightY-dipY); }
      return py<=wy;
    }
    function drawBg() {
      const pts=getTrianglePoints();
      ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
      pts.slice(1).forEach(p=>ctx.lineTo(p.x,p.y));
      ctx.closePath(); ctx.fillStyle='#111110'; ctx.fill();
      if (bgLoaded) {
        ctx.save(); ctx.beginPath(); ctx.moveTo(pts[0].x,pts[0].y);
        pts.slice(1).forEach(p=>ctx.lineTo(p.x,p.y)); ctx.closePath(); ctx.clip();
        const iw=bgImg.naturalWidth, ih=bgImg.naturalHeight;
        const scale=Math.max(W/iw, pts[3].y/ih);
        const dw=iw*scale, dh=ih*scale, dx=(W-dw)/2, dy=-dh*0.18;
        ctx.globalAlpha=0.18; ctx.drawImage(bgImg,dx,dy,dw,dh);
        ctx.globalAlpha=1; ctx.restore();
      }
      const dipX=pts[3].x, dipY=pts[3].y, leftY=pts[4].y, rightY=pts[2].y;
      ctx.beginPath(); ctx.moveTo(0,leftY); ctx.lineTo(dipX,dipY); ctx.lineTo(W,rightY);
      ctx.strokeStyle='rgba(255,255,255,0.10)'; ctx.lineWidth=1.5; ctx.stroke();
    }
    function drawSquares() {
      squares.forEach(s => {
        const above=isAboveTriangle(s.x,s.y);
        ctx.save(); ctx.translate(s.x,s.y); ctx.rotate(s.rot); ctx.globalAlpha=s.alpha;
        ctx.strokeStyle=above?'rgba(255,255,255,0.18)':'rgba(17,17,16,0.22)';
        ctx.fillStyle=above?'rgba(46,46,42,0.30)':'rgba(46,46,42,0.08)';
        ctx.lineWidth=1.5; ctx.beginPath();
        ctx.rect(-s.size/2,-s.size/2,s.size,s.size); ctx.fill(); ctx.stroke(); ctx.restore();
      });
    }
    function step() {
      ctx.clearRect(0,0,W,H); drawBg();
      squares.forEach(s => {
        s.x+=s.dx; s.y+=s.dy; s.rot+=s.rotSpeed;
        if(s.y+s.size<0){s.y=H+s.size;s.x=Math.random()*W;}
        if(s.x-s.size>W) s.x=-s.size;
        if(s.x+s.size<0) s.x=W+s.size;
      });
      drawSquares(); animId=requestAnimationFrame(step);
    }
    init(); step();
    window.addEventListener('resize', init);
  })();

  function selectRole(role) {
    document.getElementById('card-trainer').classList.remove('selected');
    document.getElementById('card-student').classList.remove('selected');
    document.getElementById('card-'+role).classList.add('selected');
    setTimeout(function(){
      window.location.href = role==='trainer' ? 'app_fixed.html' : 'https://trainly.online';
    }, 380);
  }
  </script>
</body>
</html>
